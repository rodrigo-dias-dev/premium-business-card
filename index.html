<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- SEO & Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Card de visita premium com efeitos Glassmorphism e Shimmer.">
    <meta name="keywords" content="card, visita, html, css, design premium, frontend">
    <title>Premium Business Card | Rodrigo Dias</title>
    <!-- Google Fonts (Unificado) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display+SC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Estilos e Favicon -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="assets/favico-html.ico" type="image/x-icon">
</head>
<body>
    <!-- Wrapper principal para gerenciamento do layout de tela cheia -->
    <div class="mesh-gradient"></div>
    <!-- Conteúdo Principal -->
    <div class="layout-wrapper">
        <main class="main-content">
            <article class="card">
                <div class="card-crown">
                    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 38L4 14L20 24L32 6L44 24L60 14L56 38H8Z" fill="url(#gold-gradient)" />
                        <circle cx="32" cy="14" r="3" fill="url(#gold-gradient)" />
                        <rect x="14" y="40" width="36" height="4" rx="2" fill="url(#gold-gradient)" />
                        <defs>
                            <linearGradient id="gold-gradient" x1="4" y1="6" x2="60" y2="40">
                                <stop offset="0%" stop-color="#D4AF37" />
                                <stop offset="100%" stop-color="#F5D76E" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <h1 class="card-title shimmer">Excelência em Cada Detalhe</h1>

                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3L16 12L12 21L8 12L12 3Z" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round" />
                    </svg>
                </div>

                <p class="card-description">
                    Soluções premium com foco em qualidade, inovação e atendimento personalizado para resultados excepcionais.
                </p>
                <!-- Tag <a> atuando semanticamente como botão -->
                <a href="#" class="card-button" target="_self" rel="noopener noreferrer">Saiba Mais</a>
            </article>
        </main>

        <footer class="rodape">
            <p>&copy; 2026 - Rodrigo Dias | Front-End Developer</p>
        </footer>
    </div>
</body>
</html>
